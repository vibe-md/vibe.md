name: Update skills README

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/update-skills-readme.py'
      - 'scripts/build-packages.py'
      - '.github/workflows/update-skills-readme.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-skills-readme
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'vibe-md/vibe.md' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate the skill index
        run: python scripts/update-skills-readme.py
      - name: Open or update the README pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/update-skills-readme
          delete-branch: true
          add-paths: skills/README.md
          commit-message: 'Update generated skills index'
          title: 'Update the skills README index'
          body: |
            Updates the generated list of skills from the current contents of `skills/`.

            Please review the generated changes and approve the workflow run if GitHub requests it.
