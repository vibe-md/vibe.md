name: Publish catalog

# Publishes the package downloads and catalog.json as a GitHub Release after a
# change has been reviewed and merged. This workflow never runs for Pull
# Requests, so contributions from forks cannot reach it or its permissions.
#
# The website reads the latest release (see docs/MAINTAINERS.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Everything is read-only unless a job asks for more.
permissions:
  contents: read

# One publication at a time, in order. Never cancel one that is running.
concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    # Only the trusted branch of the real repository, including manual runs.
    if: github.repository == 'vibe-md/vibe.md' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release; granted to this job only
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate and test the merged commit
        run: |
          python scripts/validate-skills.py
          python -m unittest discover -s tests

      - name: Build every package and the catalog
        run: python scripts/build-packages.py --all --output-dir dist/downloads --ref "$GITHUB_SHA"

      - name: Verify the catalog against the source
        run: python scripts/build-packages.py --verify dist/downloads

      - name: Skip if a newer commit has already been merged
        id: current
        run: |
          # A slower, older run must not replace what a newer run published.
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved to $head; the run for that commit will publish."
          fi

      - name: Publish the release
        id: release
        if: steps.current.outputs.publish == 'true'
        run: |
          tag="catalog-${GITHUB_SHA:0:12}"
          if is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" = "false" ]; then
              echo "::notice::Release $tag already exists; nothing to publish."
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A draft left by an interrupted run was never public. Start over.
            gh release delete "$tag" --yes
          fi
          # Create a draft, upload every file, and only then publish, so the
          # public release is never missing files.
          gh release create "$tag" dist/downloads/* \
            --draft --target "$GITHUB_SHA" \
            --title "Catalog ${GITHUB_SHA:0:12}" \
            --notes "Package downloads and catalog.json built from ${GITHUB_SHA}."
          gh release edit "$tag" --draft=false --latest
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Rebuild the website
        if: steps.current.outputs.publish == 'true'
        env:
          # Optional. Create it in the website's Vercel project settings; see docs/MAINTAINERS.md.
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set; the website will pick up the release on its next build."
            exit 0
          fi
          # The release is already public. If this fails, re-run the job: the release step is a no-op the second time.
          curl --fail --silent --show-error --retry 3 --max-time 30 -X POST "$VERCEL_DEPLOY_HOOK_URL" >/dev/null
          echo "Triggered a website rebuild."
